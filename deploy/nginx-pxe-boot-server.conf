# PXE Boot Server: web interface and HTTP boot files.
# Installed by deploy/post-update.sh to /etc/nginx/sites-available/pxe-boot-server.

log_format pxeboot '$msec $remote_addr $status $body_bytes_sent "$uri"';

upstream pxe_boot_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/pxe-boot-access.log pxeboot;
    error_log /var/log/nginx/pxe-boot-error.log warn;

    sendfile on;
    tcp_nopush on;
    gzip off;                      # iPXE and installers expect plain bodies and exact sizes
    server_tokens off;

    # Upload chunks (must match UPLOAD_CHUNK_MAX in app/config.py)
    client_max_body_size 64m;

    # Mounted ISOs, raw ISO files, boot helpers and derived images: straight from disk,
    # with range requests (sanboot, wimboot and installers read parts of files).
    location /mnt/     { alias /srv/pxe/mnt/;     autoindex off; disable_symlinks off; }
    location /isos/    { alias /srv/pxe/isos/;    autoindex off; }
    location /boot/    { alias /srv/pxe/boot/;    autoindex off; }
    location /derived/ { alias /srv/pxe/derived/; autoindex off; }

    location /static/ {
        alias /opt/pxe-boot-server/app/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://pxe_boot_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # stream ISO chunks to the app
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
