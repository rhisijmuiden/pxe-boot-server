# >>> pxe-boot-server-global
# A PC that restarts during Windows Setup never closes its SMB connection. Detect dead
# connections within about a minute so the session (and the Live clients entry) ends.
   socket options = TCP_NODELAY SO_KEEPALIVE TCP_KEEPIDLE=30 TCP_KEEPINTVL=10 TCP_KEEPCNT=3
   deadtime = 5
# <<< pxe-boot-server-global
