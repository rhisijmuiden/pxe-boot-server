# >>> pxe-boot-server
# Read-only share with the mounted ISOs, used by Windows Setup during a network install.
[pxe]
   comment = PXE Boot Server ISOs
   path = /srv/pxe/mnt
   browseable = no
   read only = yes
   guest ok = no
   valid users = pxe
   follow symlinks = yes
   wide links = no
# <<< pxe-boot-server
