<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}{% endblock %} · {{ t('product') }}</title>
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css?v={{ version }}">
<script>try { const th = localStorage.getItem("theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}</script>
</head>
<body>
{% include "_icons.html" %}
<div class="auth">
  <div class="auth-card">
    {% include "_logo.html" %}
    {% if flashes %}<div class="flashes">{% for f in flashes %}
      <div class="flash {{ f.kind }}" role="status"><svg><use href="#i-{{ 'check' if f.kind == 'ok' else 'alert' }}"/></svg><span>{{ t(f.key, **f.kw) }}</span></div>
    {% endfor %}</div>{% endif %}
    {% block content %}{% endblock %}
    <div class="auth-foot">
      <span class="note">{{ t('product') }} v{{ version }}</span>
      <form method="post" action="/lang" class="lang-form">
        <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="back" value="{{ request.url.path }}">
        <div class="seg">{% for code in LANGS %}<button type="submit" name="lang" value="{{ code }}" class="{{ 'on' if lang == code else '' }}">{{ code|upper }}</button>{% endfor %}</div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
